<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ToDo - Register</title>
		<link rel="stylesheet" href="./style.css" />
		<script type="module" src="./register.js" defer></script>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg bg-body-tertiary">
			<div class="container-fluid">
				<div class="logo_container">Logo</div>
				<div
					class="collapse navbar-collapse justify-content-end"
					id="navbarNavAltMarkup"
				>
					<div class="navbar-nav">
						<a class="nav-link" href="./login.html">Sign in</a>
					</div>
				</div>
			</div>
		</nav>
		<section class="form__container displayFlex">
			<div class="card">
				<div class="card-header">Register</div>
				<div class="card-body">
					<div class="register__input__container">
						<label for="usernameInput" class="form-label">Username</label>
						<input
							type="text"
							id="usernameInput"
							class="form-control"
							aria-describedby="usernameHelpBlock"
						/>
						<div id="usernameHelpBlock" class="form-text">
							placeholder helper text
						</div>
					</div>
					<div class="register__input__container">
						<label for="emailInput" class="form-label">Email</label>
						<input
							type="text"
							id="emailInput"
							class="form-control"
							aria-describedby="emailHelpBlock"
						/>
						<div id="emailHelpBlock" class="form-text">
							placeholder helper text
						</div>
					</div>
					<div class="register__input__container">
						<label for="inputPassword" class="form-label">Password</label>
						<input
							type="password"
							id="inputPassword"
							class="form-control"
							aria-describedby="passwordHelpBlock"
						/>
						<div id="passwordHelpBlock" class="form-text">
							placeholder helper text
						</div>
					</div>
					<div class="register__input__container">
						<label for="inputConfirmPassword" class="form-label"
							>Confirm Password</label
						>
						<input
							type="password"
							id="inputConfirmPassword"
							class="form-control"
							aria-describedby="confirmPasswordHelpBlock"
						/>
						<div id="confirmPasswordHelpBlock" class="form-text">
							placeholder helper text
						</div>
					</div>
					<div class="register__input__container mb-2">
						<label for="ageInput" class="form-label">Age</label>
						<input
							type="number"
							id="ageInput"
							class="form-control"
							aria-describedby="agedHelpBlock"
						/>
						<div id="agedHelpBlock" class="form-text">
							placeholder helper text
						</div>
					</div>
					<a id="registerButton" class="btn btn-primary">Register</a>
				</div>
			</div>
		</section>
	</body>
</html>
